<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mobile">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>mobile</title>
  <link rel="manifest" href="manifest.json">

  <!-- Falcon AI Voice Engine Web Speech Bridge -->
  <script>
    window.falconSpeech = {
      speak: function(text) {
        try {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.05;
            utterance.pitch = 1.0;
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
          }
        } catch (e) {
          console.warn('SpeechSynthesis error:', e);
        }
      },
      listen: function() {
        try {
          const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (!SpeechRecognition) {
            console.warn('SpeechRecognition API not available in browser');
            return false;
          }
          const recognition = new SpeechRecognition();
          recognition.continuous = true;
          recognition.interimResults = false;
          recognition.lang = 'en-US';
          recognition.onresult = function(event) {
            if (event.results && event.results.length > 0) {
              const transcript = event.results[0][0].transcript;
              console.log('Falcon Voice Captured:', transcript);
              if (window.onFalconVoiceRecognized) {
                window.onFalconVoiceRecognized(transcript);
              }
            }
          };
          recognition.onerror = function(err) {
            console.warn('SpeechRecognition error:', err);
            if (window.onFalconVoiceError) {
              window.onFalconVoiceError(err.error || 'Mic error');
            }
          };
          recognition.start();
          return true;
        } catch (e) {
          console.warn('SpeechRecognition initialization failed:', e);
          return false;
        }
      }
    };
  </script>

  <!-- Modern Grainy Texture Filter -->
  <style>
    .film-grain-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999999;
      opacity: 0.05;
      background: radial-gradient(circle at center, transparent 0%, rgba(0, 0, 0, 0.25) 100%),
                  url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }
  </style>
</head>
<body>
  <div class="film-grain-overlay"></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
